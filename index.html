<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calaverita Literaria</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="contenedor">
    <h1>La Huesuda y el Código</h1>

    <p class="calaverita">
      Llegó la Parca de noche,<br>
      con su libreta y su tinta,<br>
      buscando a Lucía <br>
      en una pantalla distinta.<br><br>
      Miró los versos y el código,<br>
      sonrió con picardía,<br>
      y dijo: "Hoy no me llevo a nadie,<br>
      ¡que hoy entrega quien escribía!"
    </p>

    <img src="catrina.jpg" alt="Ilustración de calaverita literaria" class="imagen-calavera" />
  </main>
</body>
</html>
